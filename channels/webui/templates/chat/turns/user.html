<template x-if="message && $store.chat.editingMessageIndex !== turn.first_message_index">
    <div class="fullwidth">
        <template x-if="Array.isArray(message.content)">
            <div class="multimodal-content">
                <template x-for="(block, blockIndex) in message.content" :key="'block-' + blockIndex">
                    <div>
                        <template x-if="blockIndex === 0">
                            <!-- render the user's text block through the markdown
                                 pipeline (same as plain messages) instead of raw
                                 x-html, so paragraphs and formatting survive -->
                            <div x-md="{ message: { content: block.text }, live: false, raw: message._metadata?.is_cmd }"></div>
                        </template>

                        <template x-if="blockIndex > 0 && message._metadata?.filenames">
                            <div class="text-preview">
                                {% include 'svg/paperclip.svg' %}
                                <span x-text="message._metadata.filenames[blockIndex]"></span>
                            </div>
                        </template>

                        <template x-if="block.type === 'image_url'">
                            <div class="media-preview image-preview">
                                <img :src="block.image_url.url" :alt="block.image_url.url" loading="lazy" />
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <!-- -- AI GENERATED CODE (Qwen3.8-Flash-Next) :: (2026-09-15)
             switched from x-html+renderMarkdown to the x-md directive: uses the
             per-message cache, skips Alpine's initTree walk on the injected
             subtree, and avoids re-parsing markdown whenever the effect re-runs -->
        <template x-if="typeof message.content === 'string'">
            <div x-md="{ message: message, live: false, raw: message._metadata?.is_cmd }" :class="{'command': message._metadata?.is_cmd}"></div>
        </template>
    </div>
</template>

<template x-if="$store.chat.editingMessageIndex === turn.first_message_index">
    <div class="flex fullwidth editing">
        <textarea x-model="$store.chat.editContent" rows="3" x-autosize></textarea>
        <div class="edit-actions">
            <button @click="$store.chat.saveEdit($store.chat.editingMessageIndex)">Save</button>
            <button @click="$store.chat.cancelEdit()">Cancel</button>
        </div>
        <template x-if="$store.chat.editAttached.length > 0">
            <div class="edit-files">
                <template x-for="fname in $store.chat.editAttached" :key="fname">
                    <div class="edit-file-row">
                        <button class="edit-file-remove" title="Remove file" @click="$store.chat.removeEditFile(fname)">
                            {% include 'svg/cross.svg' %}
                        </button>
                        <span class="edit-file-name" x-text="fname"></span>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
